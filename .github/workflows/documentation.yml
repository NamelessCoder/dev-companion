name: Documentation

# Every push to main, rather than the paths that can change the site. The build
# is a minute and the deployment is idempotent, while a path filter is a second
# list of what the site is made of and goes stale silently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is finished rather than dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Two manifests, and build/guides/composer.json says why it is its own.
      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer install --working-dir=build/guides --no-interaction --no-progress

      # The first writes the copy that is publishable, the second renders it,
      # reading guides.xml for where both of those are. The third writes the
      # search index beside the pages, which is why it runs last.
      - name: Build the site
        run: |
          bin/cli documentation:build
          build/guides/vendor/bin/guides --no-progress
          bin/cli documentation:search

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
