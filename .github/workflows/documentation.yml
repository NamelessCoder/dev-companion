name: Documentation

# Every push to main, rather than the paths that can change the site. The build
# is a minute and the deployment is idempotent, while a path filter is a second
# list of what the site is made of and goes stale silently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is finished rather than dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The newest line composer.json supports. This job builds the site rather
      # than testing what the package runs on, which is ci.yml's matrix, so the
      # lowest supported version buys nothing here. What the renderer resolves
      # against stays 8.2: build/guides/composer.json pins the platform, so its
      # committed lock installs for somebody on the minimum too.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # The theme's finish step is one bundled file and installs nothing, so
      # node is here for that alone.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Two manifests: this package and the renderer.
      # build/guides/composer.json says why it is its own. The second is
      # installed here rather than left to the render, so a failure names the
      # install.
      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer install --working-dir=build/guides --no-interaction --no-progress

      - name: Build the site
        run: bin/cli documentation:render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
