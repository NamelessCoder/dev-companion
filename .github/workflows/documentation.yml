name: Documentation

# Every push to main, rather than the paths that can change the site. The build
# is a minute and the deployment is idempotent, while a path filter is a second
# list of what the site is made of and goes stale silently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is finished rather than dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: build/guides/package-lock.json

      # Three manifests: this package, the renderer, and what the browser runs.
      # build/guides/composer.json and package.json each say why they are their
      # own. The last two are installed here rather than left to the render, so
      # the node_modules cache above is used and a failure names the install.
      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer install --working-dir=build/guides --no-interaction --no-progress
          npm --prefix build/guides ci

      - name: Build the site
        run: bin/cli documentation:render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
