<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">How TYPO3 CMS MCP answers a task</title>
  <desc id="description">A task begins with project scope and task guidance, then branches to bundled knowledge, the project and active installation, or official live sources. The answer states its version, scope, source, and limitations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#101828" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#98a2b3"/>
    </marker>
    <style>
      .eyebrow { font: 700 14px system-ui, sans-serif; letter-spacing: 1.8px; fill: #ff8700; }
      .title { font: 700 34px system-ui, sans-serif; fill: #101828; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475467; }
      .number { font: 700 14px system-ui, sans-serif; fill: #101828; }
      .label { font: 700 18px system-ui, sans-serif; fill: #101828; }
      .copy { font: 400 14px system-ui, sans-serif; fill: #475467; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #344054; }
      .whiteLabel { font: 700 18px system-ui, sans-serif; fill: white; }
      .whiteCopy { font: 400 14px system-ui, sans-serif; fill: #fff4e7; }
      .line { fill: none; stroke: #98a2b3; stroke-width: 2.5; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #98a2b3; stroke-width: 2.5; }
      .whiteCode { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #fff4e7; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">THE ANSWER PATH</text>
  <text x="60" y="106" class="title">Context first, specialist lookup second</text>
  <text x="60" y="138" class="subtitle">The route is explicit, so a plausible answer does not silently become the wrong one.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="208" width="230" height="116" rx="20" fill="#101828"/>
    <circle cx="91" cy="240" r="16" fill="#ff8700"/>
    <text x="91" y="245" text-anchor="middle" class="number">1</text>
    <text x="119" y="246" class="whiteLabel">Read the project</text>
    <text x="86" y="280" class="whiteCode">typo3_project_describe</text>
    <text x="86" y="303" class="whiteCopy">version · extensions · commands</text>
  </g>

  <path d="M290 266 H350" class="line"/>

  <g filter="url(#shadow)">
    <rect x="350" y="208" width="230" height="116" rx="20" fill="#ffffff" stroke="#ffb55c"/>
    <circle cx="381" cy="240" r="16" fill="#ffd39b"/>
    <text x="381" y="245" text-anchor="middle" class="number">2</text>
    <text x="409" y="246" class="label">Identify the task</text>
    <text x="376" y="280" class="code">typo3_task_guide</text>
    <text x="376" y="303" class="copy">workflow · checks · next lookup</text>
  </g>

  <path d="M580 266 H640" class="line"/>

  <g filter="url(#shadow)">
    <rect x="640" y="208" width="500" height="116" rx="20" fill="#fff4e7" stroke="#ffb55c"/>
    <circle cx="671" cy="240" r="16" fill="#ff8700"/>
    <text x="671" y="245" text-anchor="middle" class="number">3</text>
    <text x="699" y="246" class="label">Ask the specialist tool</text>
    <text x="666" y="280" class="copy">component · icon · label · schema · changelog · documentation</text>
    <text x="666" y="303" class="copy">rule · hint · test · commit · Forge · Gerrit</text>
  </g>

  <path d="M890 324 V374 H220 M220 374 H980" class="bus"/>
  <path d="M220 374 V414" class="line"/>
  <path d="M600 374 V414" class="line"/>
  <path d="M980 374 V414" class="line"/>

  <g aria-label="Source choice">
    <rect x="60" y="414" width="320" height="94" rx="18" fill="#ffffff" stroke="#ffb55c"/>
    <rect x="60" y="414" width="8" height="94" rx="4" fill="#ff8700"/>
    <text x="90" y="449" class="label">Bundled knowledge</text>
    <text x="90" y="476" class="copy">Version-bound and available offline</text>

    <rect x="440" y="414" width="320" height="94" rx="18" fill="#ffffff" stroke="#a4bcfd"/>
    <rect x="440" y="414" width="8" height="94" rx="4" fill="#6172f3"/>
    <text x="470" y="449" class="label">Project or installation</text>
    <text x="470" y="476" class="copy">The state that is active here</text>

    <rect x="820" y="414" width="320" height="94" rx="18" fill="#ffffff" stroke="#75e0a7"/>
    <rect x="820" y="414" width="8" height="94" rx="4" fill="#12b76a"/>
    <text x="850" y="449" class="label">Official live source</text>
    <text x="850" y="476" class="copy">Canonical docs or core service</text>
  </g>

  <path d="M220 508 V536 H980 M600 508 V536 M980 508 V536" class="bus"/>
  <path d="M600 536 V560" class="line"/>

  <rect x="350" y="560" width="500" height="74" rx="18" fill="#101828"/>
  <text x="379" y="591" class="whiteLabel">Answer with evidence</text>
  <text x="379" y="615" class="whiteCopy">version · scope · answeredBy · limits · structuredContent</text>
</svg>
