<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">How TYPO3 Dev Companion answers a task</title>
  <desc id="description">A task begins with project scope and task guidance, then branches to bundled knowledge, the project and active installation, or official live sources. The answer states its version, scope, source, and limitations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#1C1A17" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#8A8378"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#FBFAF7"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">THE ANSWER PATH</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Context first, specialist lookup second</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The route is explicit, so a plausible answer does not silently become the wrong one.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="208" width="230" height="116" rx="6" fill="#1C1A17"/>
    <circle cx="91" cy="240" r="16" fill="#FF8700"/>
    <text x="91" y="245" text-anchor="middle" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">1</text>
    <text x="119" y="246" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FBFAF7">Read the project</text>
    <text x="86" y="280" font-weight="600" font-size="14" font-family="'Source Code Pro',ui-monospace,monospace" fill="#FFF6EC">typo3_project_describe</text>
    <text x="86" y="303" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">version · extensions · commands</text>
  </g>
  <path d="M290 266 H350" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="350" y="208" width="230" height="116" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
    <circle cx="381" cy="240" r="16" fill="#F0C089"/>
    <text x="381" y="245" text-anchor="middle" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">2</text>
    <text x="409" y="246" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Identify the task</text>
    <text x="376" y="280" font-weight="600" font-size="14" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">typo3_task_guide</text>
    <text x="376" y="303" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">workflow · checks · next lookup</text>
  </g>
  <path d="M580 266 H640" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="640" y="208" width="500" height="116" rx="6" fill="#FFF6EC" stroke="#F0C089"/>
    <circle cx="671" cy="240" r="16" fill="#EFEBE3"/>
    <text x="671" y="245" text-anchor="middle" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">3</text>
    <text x="699" y="246" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Ask the specialist tool</text>
    <text x="666" y="280" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">component · icon · label · schema · changelog · documentation</text>
    <text x="666" y="303" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">rule · hint · test · commit · Forge · Gerrit</text>
  </g>
  <path d="M890 324 V374 H220 M220 374 H980" fill="none" stroke="#8A8378" stroke-width="1.5"/>
  <path d="M220 374 V414" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 374 V414" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M980 374 V414" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g aria-label="Source choice">
    <rect x="60" y="414" width="320" height="94" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
    <rect x="60" y="414" width="8" height="94" rx="4" fill="#C9C3B7"/>
    <text x="90" y="449" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Bundled knowledge</text>
    <text x="90" y="476" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Version-bound and available offline</text>
    <rect x="440" y="414" width="320" height="94" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
    <rect x="440" y="414" width="8" height="94" rx="4" fill="#C9C3B7"/>
    <text x="470" y="449" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Project or installation</text>
    <text x="470" y="476" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The state that is active here</text>
    <rect x="820" y="414" width="320" height="94" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
    <rect x="820" y="414" width="8" height="94" rx="4" fill="#C9C3B7"/>
    <text x="850" y="449" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Official live source</text>
    <text x="850" y="476" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Canonical docs or core service</text>
  </g>
  <path d="M220 508 V536 H980 M600 508 V536 M980 508 V536" fill="none" stroke="#8A8378" stroke-width="1.5"/>
  <path d="M600 536 V560" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="560" width="500" height="74" rx="6" fill="#1C1A17"/>
  <text x="379" y="591" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FBFAF7">Answer with evidence</text>
  <text x="379" y="615" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">version · scope · answeredBy · limits · structuredContent</text>
</svg>
