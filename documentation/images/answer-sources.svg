<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Five answer sources</title>
  <desc id="description">TYPO3 CMS MCP tools declare whether they can answer from the active installation, installed package files, bundled knowledge, official network services, or this server's own checkout.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#101828" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a2b3"/></marker>
    <style>.eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.label{font:700 18px system-ui,sans-serif;fill:#101828}.copy{font:400 14px system-ui,sans-serif;fill:#475467}.code{font:600 13px ui-monospace,monospace;fill:#344054}.whiteLabel{font:700 20px system-ui,sans-serif;fill:#fff}.whiteCopy{font:400 14px system-ui,sans-serif;fill:#fff4e7}.line{fill:none;stroke:#98a2b3;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">SOURCE DECLARATION = AVAILABILITY</text>
  <text x="60" y="106" class="title">Five places can answer a tool</text>
  <text x="60" y="138" class="subtitle">The source says whether a question is worth asking in the machine's current state.</text>

  <rect x="440" y="300" width="320" height="140" rx="24" fill="#101828" filter="url(#shadow)"/>
  <text x="468" y="346" class="whiteLabel">TYPO3 CMS MCP tool</text>
  <text x="468" y="377" class="whiteCopy">declares every source it can use</text>
  <text x="468" y="405" class="whiteCopy">returns answeredBy where paths vary</text>

  <path d="M350 244 H390 V340 H428" class="line"/>
  <path d="M350 492 H390 V400 H428" class="line"/>
  <path d="M850 244 H810 V340 H772" class="line"/>
  <path d="M850 492 H810 V400 H772" class="line"/>
  <path d="M600 278 V288" class="line"/>

  <rect x="60" y="190" width="290" height="108" rx="18" fill="#ffffff" stroke="#a4bcfd"/>
  <rect x="60" y="190" width="8" height="108" rx="4" fill="#6172f3"/>
  <text x="90" y="226" class="label">installation</text>
  <text x="90" y="252" class="copy">Assembled runtime state.</text>
  <text x="90" y="274" class="copy">Requires a reachable installation.</text>

  <rect x="60" y="438" width="290" height="108" rx="18" fill="#ffffff" stroke="#84caff"/>
  <rect x="60" y="438" width="8" height="108" rx="4" fill="#0ba5ec"/>
  <text x="90" y="474" class="label">packages</text>
  <text x="90" y="500" class="copy">Files read without executing them.</text>
  <text x="90" y="522" class="copy">Available on a fresh clone.</text>

  <rect x="455" y="170" width="290" height="108" rx="18" fill="#fff4e7" stroke="#ffb55c"/>
  <rect x="455" y="170" width="8" height="108" rx="4" fill="#ff8700"/>
  <text x="485" y="206" class="label">knowledge</text>
  <text x="485" y="232" class="copy">Bundled and version-bound.</text>
  <text x="485" y="254" class="copy">Works with nothing running.</text>

  <rect x="850" y="190" width="290" height="108" rx="18" fill="#ffffff" stroke="#75e0a7"/>
  <rect x="850" y="190" width="8" height="108" rx="4" fill="#12b76a"/>
  <text x="880" y="226" class="label">network</text>
  <text x="880" y="252" class="copy">Official live services.</text>
  <text x="880" y="274" class="copy">Unavailable is not an empty result.</text>

  <rect x="850" y="438" width="290" height="108" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <rect x="850" y="438" width="8" height="108" rx="4" fill="#667085"/>
  <text x="880" y="474" class="label">checkout</text>
  <text x="880" y="500" class="copy">This server's own repository.</text>
  <text x="880" y="522" class="copy">Feedback tools; standalone only.</text>

  <rect x="230" y="594" width="740" height="64" rx="18" fill="#ecfdf3" stroke="#75e0a7"/>
  <text x="258" y="633" class="label">Every answer keeps its source visible; every fallback states what it leaves out.</text>
</svg>
