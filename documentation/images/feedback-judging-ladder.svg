<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Feedback judging ladder</title>
  <desc id="description">Feedback is diagnosed in five steps from gap through delivery, routing, wording, and decision. The first step supported by repository evidence stops the descent.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8A8378"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#FBFAF7"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">DIAGNOSE BEFORE CHOOSING THE FIX</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Walk the feedback down the ladder</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Read the corpus first. The first rung supported by evidence stops the descent.</text>
  <rect x="60" y="174" width="290" height="90" rx="6" fill="#1C1A17"/>
  <text x="84" y="202" font-weight="600" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#F0C089">THE ONE QUESTION</text>
  <text x="84" y="229" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFFFFF">Could the server</text>
  <text x="84" y="252" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFFFFF">have prevented it?</text>
  <path d="M350 219 H410" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="410" y="174" width="730" height="90" rx="6" fill="#FFF6EC" stroke="#F0C089"/>
    <circle cx="451" cy="219" r="25" fill="#FF8700"/><text x="451" y="227" text-anchor="middle" font-weight="700" font-size="24" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">1</text>
    <text x="494" y="211" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Gap</text><text x="494" y="238" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The knowledge, tool or task skill is not here.</text>
  </g>
  <path d="M775 264 V286" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="410" y="286" width="730" height="78" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
    <circle cx="451" cy="325" r="23" fill="#F0C089"/><text x="451" y="332" text-anchor="middle" font-weight="700" font-size="24" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">2</text>
    <text x="492" y="317" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Delivery</text><text x="492" y="343" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The answer exists, but the session never received it.</text>
  </g>
  <path d="M775 364 V386" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="410" y="386" width="730" height="78" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
    <circle cx="451" cy="425" r="23" fill="#F4F2EE"/><text x="451" y="432" text-anchor="middle" font-weight="700" font-size="24" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">3</text>
    <text x="492" y="417" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Routing</text><text x="492" y="443" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The right skill or tool existed and did not fire.</text>
  </g>
  <path d="M775 464 V486" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="410" y="486" width="730" height="78" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
    <circle cx="451" cy="525" r="23" fill="#F4F2EE"/><text x="451" y="532" text-anchor="middle" font-weight="700" font-size="24" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">4</text>
    <text x="492" y="517" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Wording</text><text x="492" y="543" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The answer arrived, but its wording did not take.</text>
  </g>
  <path d="M775 564 V586" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="410" y="586" width="730" height="78" rx="6" fill="#F4F2EE" stroke="#C9C3B7"/>
    <circle cx="451" cy="625" r="23" fill="#C9C3B7"/><text x="451" y="632" text-anchor="middle" font-weight="700" font-size="24" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">5</text>
    <text x="492" y="617" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Decision</text><text x="492" y="643" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Everything worked; the design itself carries the cost.</text>
  </g>
  <rect x="60" y="320" width="300" height="176" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
  <text x="84" y="355" font-weight="600" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">EVIDENCE BEFORE APPETITE</text>
  <text x="84" y="386" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Check knowledge, skills, tools,</text>
  <text x="84" y="409" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">transcripts and recorded runs.</text>
  <text x="84" y="447" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Name the diagnosed gap first.</text>
  <text x="84" y="470" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Choose the remedy afterwards.</text>
</svg>
