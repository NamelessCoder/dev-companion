<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Feedback judging ladder</title>
  <desc id="description">Feedback is diagnosed in five steps from gap through delivery, routing, wording, and decision. The first step supported by repository evidence stops the descent.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a2b3"/></marker>
    <style>.eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.step{font:700 24px system-ui,sans-serif;fill:#101828}.label{font:700 18px system-ui,sans-serif;fill:#101828}.copy{font:400 14px system-ui,sans-serif;fill:#475467}.small{font:600 13px system-ui,sans-serif;fill:#344054}.whiteSmall{font:600 13px system-ui,sans-serif;fill:#ffb55c}.whiteLabel{font:700 18px system-ui,sans-serif;fill:#fff}.line{fill:none;stroke:#98a2b3;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">DIAGNOSE BEFORE CHOOSING THE FIX</text>
  <text x="60" y="106" class="title">Walk the feedback down the ladder</text>
  <text x="60" y="138" class="subtitle">Read the corpus first. The first rung supported by evidence stops the descent.</text>

  <rect x="60" y="174" width="290" height="90" rx="18" fill="#101828"/>
  <text x="84" y="202" class="whiteSmall">THE ONE QUESTION</text>
  <text x="84" y="229" class="whiteLabel">Could the server</text>
  <text x="84" y="252" class="whiteLabel">have prevented it?</text>
  <path d="M350 219 H410" class="line"/>

  <g>
    <rect x="410" y="174" width="730" height="90" rx="18" fill="#fff4e7" stroke="#ffb55c"/>
    <circle cx="451" cy="219" r="25" fill="#ff8700"/><text x="451" y="227" text-anchor="middle" class="step">1</text>
    <text x="494" y="211" class="label">Gap</text><text x="494" y="238" class="copy">The knowledge, tool or task skill is not here.</text>
  </g>
  <path d="M775 264 V286" class="line"/>
  <g>
    <rect x="410" y="286" width="730" height="78" rx="18" fill="#ffffff" stroke="#ffc77d"/>
    <circle cx="451" cy="325" r="23" fill="#ffd39b"/><text x="451" y="332" text-anchor="middle" class="step">2</text>
    <text x="492" y="317" class="label">Delivery</text><text x="492" y="343" class="copy">The answer exists, but the session never received it.</text>
  </g>
  <path d="M775 364 V386" class="line"/>
  <g>
    <rect x="410" y="386" width="730" height="78" rx="18" fill="#ffffff" stroke="#a4bcfd"/>
    <circle cx="451" cy="425" r="23" fill="#d1e0ff"/><text x="451" y="432" text-anchor="middle" class="step">3</text>
    <text x="492" y="417" class="label">Routing</text><text x="492" y="443" class="copy">The right skill or tool existed and did not fire.</text>
  </g>
  <path d="M775 464 V486" class="line"/>
  <g>
    <rect x="410" y="486" width="730" height="78" rx="18" fill="#ffffff" stroke="#84caff"/>
    <circle cx="451" cy="525" r="23" fill="#b9e6fe"/><text x="451" y="532" text-anchor="middle" class="step">4</text>
    <text x="492" y="517" class="label">Wording</text><text x="492" y="543" class="copy">The answer arrived, but its wording did not take.</text>
  </g>
  <path d="M775 564 V586" class="line"/>
  <g>
    <rect x="410" y="586" width="730" height="78" rx="18" fill="#ecfdf3" stroke="#75e0a7"/>
    <circle cx="451" cy="625" r="23" fill="#75e0a7"/><text x="451" y="632" text-anchor="middle" class="step">5</text>
    <text x="492" y="617" class="label">Decision</text><text x="492" y="643" class="copy">Everything worked; the design itself carries the cost.</text>
  </g>

  <rect x="60" y="320" width="300" height="176" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="84" y="355" class="small">EVIDENCE BEFORE APPETITE</text>
  <text x="84" y="386" class="copy">Check knowledge, skills, tools,</text>
  <text x="84" y="409" class="copy">transcripts and recorded runs.</text>
  <text x="84" y="447" class="copy">Name the diagnosed gap first.</text>
  <text x="84" y="470" class="copy">Choose the remedy afterwards.</text>
</svg>
