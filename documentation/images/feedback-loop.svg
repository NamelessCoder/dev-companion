<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="fl-t fl-d">
<title id="fl-t">A gap becomes a tested improvement</title>
<desc id="fl-d">The five steps of the loop, one per row: a real task uses the server, finds a gap, records it as feedback, settles it into a requirement or decision with the check that holds it, and a later task verifies the change. The right column names what the repository is left holding at each step; the orange path closes the loop from the last step back to the first.</desc>
<rect width="800" height="660" fill="#FBFAF7"></rect>

<text x="60" y="60" fill="#FF8700" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" font-weight="600" letter-spacing="1.6">THE KNOWLEDGE TRAINS THROUGH USE</text>
<text x="60" y="104" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">A gap becomes a tested improvement</text>
<text x="60" y="132" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="17">Evidence stays in the repository instead of leaving with the session.</text>
<line x1="60" y1="162" x2="740" y2="162" stroke="#E3DFD6" stroke-width="1"></line>

<text x="490" y="190" fill="#8A8378" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" letter-spacing="1.2">KEPT IN THE REPOSITORY</text>

<line x1="60" y1="204" x2="740" y2="204" stroke="#E3DFD6" stroke-width="1"></line>
<text x="190" y="230" text-anchor="end" fill="#8A8378" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">01 · USE</text>
<text x="210" y="230" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="15" font-weight="600">Real task</text>
<text x="210" y="250" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="13">Ask the server before searching elsewhere.</text>

<line x1="60" y1="272" x2="740" y2="272" stroke="#E3DFD6" stroke-width="1"></line>
<text x="190" y="298" text-anchor="end" fill="#8A8378" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">02 · FIND</text>
<text x="210" y="298" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="15" font-weight="600">One gap</text>
<text x="210" y="318" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="13">Missing, wrong or unhelpful — with proof.</text>

<line x1="60" y1="340" x2="740" y2="340" stroke="#E3DFD6" stroke-width="1"></line>
<text x="190" y="366" text-anchor="end" fill="#8A8378" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">03 · RECORD</text>
<text x="210" y="366" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="15" font-weight="600">Feedback</text>
<text x="210" y="386" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="13">One subject, one file, reproducible.</text>
<text x="490" y="366" fill="#1C1A17" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">feedback/</text>

<line x1="60" y1="408" x2="740" y2="408" stroke="#E3DFD6" stroke-width="1"></line>
<text x="190" y="434" text-anchor="end" fill="#8A8378" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">04 · SETTLE</text>
<text x="210" y="434" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="15" font-weight="600">Improvement</text>
<text x="210" y="454" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="13">The change, and the check that holds it.</text>
<text x="490" y="434" fill="#1C1A17" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">requirements/ · decisions/</text>

<line x1="60" y1="476" x2="740" y2="476" stroke="#E3DFD6" stroke-width="1"></line>
<text x="190" y="502" text-anchor="end" fill="#8A8378" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">05 · TEST</text>
<text x="210" y="502" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="15" font-weight="600">Next task</text>
<text x="210" y="522" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="13">Verify what changed; keep the evidence.</text>

<!-- The loop closing is what the drawing is about, so it is the one element in orange. -->
<path d="M88 528 V216 H98" stroke="#FF8700" stroke-width="2" fill="none"></path>
<path d="M94 211 104 216 94 221Z" fill="#FF8700"></path>
<path d="M104 528 H88" stroke="#FF8700" stroke-width="2" fill="none"></path>

<line x1="60" y1="580" x2="740" y2="580" stroke="#C9C3B7" stroke-width="1"></line>
<text x="60" y="612" fill="#1C1A17" font-family="'Source Sans 3',system-ui,sans-serif" font-size="16" font-weight="600">The finding outlives the session that made it.</text>
<text x="60" y="636" fill="#4A453D" font-family="'Source Sans 3',system-ui,sans-serif" font-size="14">Each part has one place, so a later task is judged against what the last one wrote.</text>
</svg>
