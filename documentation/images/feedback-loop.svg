<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">TYPO3 CMS MCP feedback loop</title>
  <desc id="description">A real task uses the server, exposes one knowledge gap, records a feedback, turns it into a tested improvement, and verifies that improvement in the next real task.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a2b3"/></marker>
    <style>
      .eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.tag{font:700 12px ui-monospace,monospace;fill:#344054}.label{font:700 17px system-ui,sans-serif;fill:#101828}.copy{font:400 13px system-ui,sans-serif;fill:#475467}.code{font:600 13px ui-monospace,monospace;fill:#344054}.whiteTag{font:700 12px ui-monospace,monospace;fill:#101828}.whiteLabel{font:700 17px system-ui,sans-serif;fill:#fff}.whiteCopy{font:400 13px system-ui,sans-serif;fill:#fff4e7}.line{fill:none;stroke:#98a2b3;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#98a2b3;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">THE KNOWLEDGE TRAINS THROUGH USE</text>
  <text x="60" y="106" class="title">A gap becomes a tested improvement</text>
  <text x="60" y="138" class="subtitle">Evidence stays in the repository instead of disappearing with the session.</text>

  <rect x="60" y="212" width="192" height="170" rx="20" fill="#101828"/>
  <rect x="84" y="236" width="72" height="28" rx="14" fill="#ff8700"/>
  <text x="120" y="255" text-anchor="middle" class="whiteTag">01 · USE</text>
  <text x="84" y="302" class="whiteLabel">Real task</text>
  <text x="84" y="330" class="whiteCopy">Ask the server</text>
  <text x="84" y="351" class="whiteCopy">before searching</text>
  <text x="84" y="372" class="whiteCopy">somewhere else.</text>

  <path d="M252 297 H280" class="line"/>
  <rect x="292" y="212" width="192" height="170" rx="20" fill="#ffffff" stroke="#ffb55c"/>
  <rect x="316" y="236" width="76" height="28" rx="14" fill="#ffd39b"/>
  <text x="354" y="255" text-anchor="middle" class="tag">02 · FIND</text>
  <text x="316" y="302" class="label">One gap</text>
  <text x="316" y="330" class="copy">Missing, wrong or</text>
  <text x="316" y="351" class="copy">unhelpful, with the</text>
  <text x="316" y="372" class="copy">answer attached.</text>

  <path d="M484 297 H512" class="line"/>
  <rect x="524" y="212" width="192" height="170" rx="20" fill="#fff4e7" stroke="#ffb55c"/>
  <rect x="548" y="236" width="90" height="28" rx="14" fill="#ff8700"/>
  <text x="593" y="255" text-anchor="middle" class="whiteTag">03 · RECORD</text>
  <text x="548" y="302" class="label">Feedback</text>
  <text x="548" y="330" class="copy">One subject, one file,</text>
  <text x="548" y="351" class="copy">enough evidence to</text>
  <text x="548" y="372" class="copy">reproduce it.</text>

  <path d="M716 297 H744" class="line"/>
  <rect x="756" y="212" width="192" height="170" rx="20" fill="#ffffff" stroke="#a4bcfd"/>
  <rect x="780" y="236" width="88" height="28" rx="14" fill="#d1e0ff"/>
  <text x="824" y="255" text-anchor="middle" class="tag">04 · SETTLE</text>
  <text x="780" y="302" class="label">Improvement</text>
  <text x="780" y="330" class="copy">Requirement, decision,</text>
  <text x="780" y="351" class="copy">code and the check</text>
  <text x="780" y="372" class="copy">that holds it.</text>

  <path d="M948 297 H976" class="line"/>
  <rect x="988" y="212" width="152" height="170" rx="20" fill="#ecfdf3" stroke="#75e0a7"/>
  <rect x="1012" y="236" width="72" height="28" rx="14" fill="#75e0a7"/>
  <text x="1048" y="255" text-anchor="middle" class="tag">05 · TEST</text>
  <text x="1012" y="302" class="label">Next task</text>
  <text x="1012" y="330" class="copy">Verify what</text>
  <text x="1012" y="351" class="copy">changed and</text>
  <text x="1012" y="372" class="copy">keep the evidence.</text>

  <rect x="292" y="456" width="656" height="102" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="320" y="490" class="label">The repository keeps each part distinct</text>
  <text x="320" y="521" class="code">feedback/</text><text x="430" y="521" class="copy">finding</text>
  <text x="516" y="521" class="code">todo/</text><text x="584" y="521" class="copy">order</text>
  <text x="662" y="521" class="code">requirements/</text><text x="786" y="521" class="copy">what must hold</text>

  <path d="M1064 382 V610 H156 V394" class="return"/>
  <text x="480" y="636" class="copy">The next verified task starts the learning loop again.</text>
</svg>
