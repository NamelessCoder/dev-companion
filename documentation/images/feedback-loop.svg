<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">TYPO3 CMS MCP feedback loop</title>
  <desc id="description">A real task uses the server, exposes a knowledge gap, records one feedback, moves it through the todo queue into a requirement or decision and an implementation, then verifies the improved server in another real task.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#101828" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#98a2b3"/>
    </marker>
    <style>
      .eyebrow { font: 700 14px system-ui, sans-serif; letter-spacing: 1.8px; fill: #ff8700; }
      .title { font: 700 34px system-ui, sans-serif; fill: #101828; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475467; }
      .label { font: 700 18px system-ui, sans-serif; fill: #101828; }
      .copy { font: 400 14px system-ui, sans-serif; fill: #475467; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #344054; }
      .whiteLabel { font: 700 18px system-ui, sans-serif; fill: white; }
      .whiteCopy { font: 400 14px system-ui, sans-serif; fill: #fff4e7; }
      .line { fill: none; stroke: #98a2b3; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">THE KNOWLEDGE TRAINS THROUGH USE</text>
  <text x="60" y="106" class="title">A gap becomes a tested improvement</text>
  <text x="60" y="138" class="subtitle">Evidence stays in the repository instead of disappearing with the session.</text>

  <path d="M272 260 C360 180 458 180 538 244" class="line"/>
  <path d="M677 245 C774 179 900 203 939 292" class="line"/>
  <path d="M948 376 C914 472 798 501 690 457" class="line"/>
  <path d="M521 459 C411 508 291 473 254 381" class="line"/>

  <g filter="url(#shadow)">
    <rect x="60" y="218" width="250" height="150" rx="22" fill="#101828"/>
    <rect x="84" y="242" width="76" height="28" rx="14" fill="#ff8700"/>
    <text x="122" y="261" text-anchor="middle" class="code" fill="#101828">01 · USE</text>
    <text x="84" y="306" class="whiteLabel">Work on a real task</text>
    <text x="84" y="332" class="whiteCopy">Ask the server before searching</text>
    <text x="84" y="353" class="whiteCopy">somewhere else.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="198" width="250" height="150" rx="22" fill="#ffffff" stroke="#ffb55c"/>
    <rect x="499" y="222" width="76" height="28" rx="14" fill="#ffd39b"/>
    <text x="537" y="241" text-anchor="middle" class="code">02 · FIND</text>
    <text x="499" y="286" class="label">Expose one gap</text>
    <text x="499" y="312" class="copy">Missing, wrong or unhelpful —</text>
    <text x="499" y="333" class="copy">with the answer attached.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="260" width="250" height="150" rx="22" fill="#fff4e7" stroke="#ffb55c"/>
    <rect x="914" y="284" width="90" height="28" rx="14" fill="#ff8700"/>
    <text x="959" y="303" text-anchor="middle" class="code">03 · RECORD</text>
    <text x="914" y="348" class="label">Create a feedback</text>
    <text x="914" y="374" class="copy">One subject, one file, enough</text>
    <text x="914" y="395" class="copy">evidence to reproduce it.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="408" width="250" height="150" rx="22" fill="#ffffff" stroke="#a4bcfd"/>
    <rect x="499" y="432" width="92" height="28" rx="14" fill="#d1e0ff"/>
    <text x="545" y="451" text-anchor="middle" class="code">04 · SETTLE</text>
    <text x="499" y="496" class="label">Queue and implement</text>
    <text x="499" y="522" class="copy">Requirement, decision, code</text>
    <text x="499" y="543" class="copy">and the check that holds it.</text>
  </g>

  <g aria-label="Repository records">
    <rect x="60" y="492" width="330" height="112" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
    <text x="84" y="524" class="code">feedback/</text>
    <text x="215" y="524" class="copy">what the session found</text>
    <text x="84" y="550" class="code">todo/</text>
    <text x="215" y="550" class="copy">what happens next</text>
    <text x="84" y="576" class="code">requirements/</text>
    <text x="215" y="576" class="copy">what must keep holding</text>
  </g>

  <g aria-label="Verification">
    <rect x="810" y="492" width="330" height="112" rx="18" fill="#ecfdf3" stroke="#75e0a7"/>
    <text x="834" y="527" class="label">Verify in the next task</text>
    <text x="834" y="554" class="copy">The archived feedback remains</text>
    <text x="834" y="575" class="copy">evidence of what changed and why.</text>
  </g>
  <path d="M725 483 H798" class="line"/>
</svg>
