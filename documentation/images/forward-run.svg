<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">Forward run lifecycle</title>
  <desc id="description">A recorded scenario is run in a clean real project with current skills and server. A fresh unsteered session produces a transcript and working-tree state. These are graded against fixed criteria, recorded as a run, and may produce server feedback or a new contract case.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8A8378"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#FBFAF7"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">EVIDENCE FROM A REAL TASK</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">From scenario to a reusable finding</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The prompt is fixed, the session is unsteered, and the transcript decides the judgment.</text>
  <rect x="60" y="204" width="220" height="126" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
  <circle cx="91" cy="235" r="17" fill="#EFEBE3"/><text x="91" y="241" text-anchor="middle" font-weight="700" font-size="15" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">1</text>
  <text x="118" y="241" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Prepare</text>
  <text x="86" y="276" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">recorded scenario</text>
  <text x="86" y="300" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">clean real project</text>
  <text x="86" y="322" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">current skills + server</text>
  <path d="M280 267 H330" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="204" width="220" height="126" rx="6" fill="#1C1A17"/>
  <circle cx="361" cy="235" r="17" fill="#FF8700"/><text x="361" y="241" text-anchor="middle" font-weight="700" font-size="15" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">2</text>
  <text x="388" y="241" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFFFFF">Run</text>
  <text x="356" y="276" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">fresh agent session</text>
  <text x="356" y="300" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">prompt pasted verbatim</text>
  <text x="356" y="322" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">no steering</text>
  <path d="M550 267 H600" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="204" width="220" height="126" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
  <circle cx="631" cy="235" r="17" fill="#F4F2EE"/><text x="631" y="241" text-anchor="middle" font-weight="700" font-size="15" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">3</text>
  <text x="658" y="241" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Collect</text>
  <text x="626" y="276" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">transcript + tool arguments</text>
  <text x="626" y="300" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">skills activated</text>
  <text x="626" y="322" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">git status afterwards</text>
  <path d="M820 267 H870" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="870" y="204" width="270" height="126" rx="6" fill="#F4F2EE" stroke="#C9C3B7"/>
  <circle cx="901" cy="235" r="17" fill="#C9C3B7"/><text x="901" y="241" text-anchor="middle" font-weight="700" font-size="15" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">4</text>
  <text x="928" y="241" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Judge and record</text>
  <text x="896" y="276" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">criteria as written</text>
  <text x="896" y="300" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">one evidence-based judgment each</text>
  <text x="896" y="322" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">one file in scenarios/runs/</text>
  <path d="M1005 330 V372 H600 V404" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="405" y="404" width="390" height="92" rx="6" fill="#FFF6EC" stroke="#F0C089"/>
  <text x="431" y="440" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Ask what transfers beyond this project</text>
  <text x="431" y="468" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The verdict stays in the run; the reusable lesson moves on.</text>
  <path d="M515 496 V534 H327 V552" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M685 496 V534 H872 V552" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="564" width="354" height="82" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
  <text x="176" y="597" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Server feedback</text>
  <text x="176" y="623" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">missing, wrong or unhelpful answer</text>
  <rect x="696" y="564" width="354" height="82" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
  <text x="722" y="597" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">New contract case</text>
  <text x="722" y="623" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">repeatable task or failure shape</text>
</svg>
