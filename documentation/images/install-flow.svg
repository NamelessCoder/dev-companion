<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">TYPO3 Dev Companion installation flow</title>
  <desc id="description">A standalone checkout or Composer dependency provides the entrypoint. Install or update writes client configuration, publishes skills and records setup state. The client may need trust approval or a restart before a fresh session can verify the server.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#1C1A17" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8A8378"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#FBFAF7"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">INSTALL ONCE · REFRESH WITH UPDATE</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">From package to an active client</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Writing the files is setup; client trust and a fresh session make them active.</text>
  <rect x="60" y="212" width="238" height="96" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
  <text x="86" y="248" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Standalone checkout</text>
  <text x="86" y="275" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">bin/typo3-dev-companion</text>
  <rect x="60" y="332" width="238" height="96" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
  <text x="86" y="368" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Composer dependency</text>
  <text x="86" y="395" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">vendor/bin/typo3-dev-companion</text>
  <path d="M298 260 H330 V380 H298" fill="none" stroke="#8A8378" stroke-width="1.5"/>
  <path d="M330 320 H350" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="260" width="220" height="120" rx="6" fill="#1C1A17" filter="url(#shadow)"/>
  <text x="376" y="301" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFFFFF">Install or update</text>
  <text x="376" y="330" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">generic or --agent=&lt;id&gt;</text>
  <text x="376" y="354" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">DDEV-aware command</text>
  <path d="M570 320 H628" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="628" y="194" width="252" height="252" rx="6" fill="#FFF6EC" stroke="#F0C089" filter="url(#shadow)"/>
  <text x="654" y="232" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Project files written</text>
  <rect x="654" y="254" width="200" height="48" rx="6" fill="#FFFFFF"/>
  <text x="670" y="283" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">MCP configuration</text>
  <rect x="654" y="316" width="200" height="48" rx="6" fill="#FFFFFF"/>
  <text x="670" y="345" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">published task skills</text>
  <rect x="654" y="378" width="200" height="48" rx="6" fill="#FFFFFF"/>
  <text x="670" y="407" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">state.json</text>
  <path d="M880 320 H938" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="938" y="212" width="202" height="216" rx="6" fill="#FFFFFF" stroke="#C9C3B7" filter="url(#shadow)"/>
  <text x="964" y="250" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Activate in client</text>
  <text x="964" y="283" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">1. Trust or approve</text>
  <text x="964" y="311" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">2. Restart if required</text>
  <text x="964" y="339" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">3. Start a fresh session</text>
  <path d="M964 362 H1114" stroke="#E3DFD6"/>
  <text x="964" y="392" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">tools/list</text>
  <text x="964" y="414" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">confirms the server</text>
  <rect x="350" y="500" width="790" height="92" rx="6" fill="#F4F2EE" stroke="#C9C3B7"/>
  <text x="378" y="535" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Ready</text>
  <text x="378" y="563" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">The client exposes typo3_* tools and the installed task skills; update refreshes every recorded setup.</text>
  <path d="M1039 428 V488" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
