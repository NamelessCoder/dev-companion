<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">TYPO3 CMS MCP installation flow</title>
  <desc id="description">A standalone checkout or Composer dependency provides the entrypoint. Install or update writes client configuration, publishes skills and records setup state. The client may need trust approval or a restart before a fresh session can verify the server.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#101828" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a2b3"/></marker>
    <style>.eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.label{font:700 18px system-ui,sans-serif;fill:#101828}.copy{font:400 14px system-ui,sans-serif;fill:#475467}.code{font:600 13px ui-monospace,monospace;fill:#344054}.whiteLabel{font:700 18px system-ui,sans-serif;fill:#fff}.whiteCopy{font:400 14px system-ui,sans-serif;fill:#fff4e7}.line{fill:none;stroke:#98a2b3;stroke-width:2.5;marker-end:url(#arrow)}.bus{fill:none;stroke:#98a2b3;stroke-width:2.5}</style>
  </defs>
  <rect width="1200" height="660" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">INSTALL ONCE · REFRESH WITH UPDATE</text>
  <text x="60" y="106" class="title">From package to an active client</text>
  <text x="60" y="138" class="subtitle">Writing the files is setup; client trust and a fresh session make them active.</text>

  <rect x="60" y="212" width="238" height="96" rx="18" fill="#ffffff" stroke="#ffb55c"/>
  <text x="86" y="248" class="label">Standalone checkout</text>
  <text x="86" y="275" class="code">bin/typo3-cms-mcp</text>
  <rect x="60" y="332" width="238" height="96" rx="18" fill="#ffffff" stroke="#ffb55c"/>
  <text x="86" y="368" class="label">Composer dependency</text>
  <text x="86" y="395" class="code">vendor/bin/typo3-cms-mcp</text>
  <path d="M298 260 H330 V380 H298" class="bus"/>
  <path d="M330 320 H350" class="line"/>

  <rect x="350" y="260" width="220" height="120" rx="20" fill="#101828" filter="url(#shadow)"/>
  <text x="376" y="301" class="whiteLabel">Install or update</text>
  <text x="376" y="330" class="whiteCopy">generic or --agent=&lt;id&gt;</text>
  <text x="376" y="354" class="whiteCopy">DDEV-aware command</text>
  <path d="M570 320 H628" class="line"/>

  <rect x="628" y="194" width="252" height="252" rx="22" fill="#fff4e7" stroke="#ffb55c" filter="url(#shadow)"/>
  <text x="654" y="232" class="label">Project files written</text>
  <rect x="654" y="254" width="200" height="48" rx="12" fill="#ffffff"/>
  <text x="670" y="283" class="code">MCP configuration</text>
  <rect x="654" y="316" width="200" height="48" rx="12" fill="#ffffff"/>
  <text x="670" y="345" class="code">published task skills</text>
  <rect x="654" y="378" width="200" height="48" rx="12" fill="#ffffff"/>
  <text x="670" y="407" class="code">state.json</text>
  <path d="M880 320 H938" class="line"/>

  <rect x="938" y="212" width="202" height="216" rx="22" fill="#ffffff" stroke="#a4bcfd" filter="url(#shadow)"/>
  <text x="964" y="250" class="label">Activate in client</text>
  <text x="964" y="283" class="copy">1. Trust or approve</text>
  <text x="964" y="311" class="copy">2. Restart if required</text>
  <text x="964" y="339" class="copy">3. Start a fresh session</text>
  <path d="M964 362 H1114" stroke="#e4e7ec"/>
  <text x="964" y="392" class="code">tools/list</text>
  <text x="964" y="414" class="copy">confirms the server</text>

  <rect x="350" y="500" width="790" height="92" rx="18" fill="#ecfdf3" stroke="#75e0a7"/>
  <text x="378" y="535" class="label">Ready</text>
  <text x="378" y="563" class="copy">The client exposes typo3_* tools and the installed task skills; update refreshes every recorded setup.</text>
  <path d="M1039 428 V488" class="line"/>
</svg>
