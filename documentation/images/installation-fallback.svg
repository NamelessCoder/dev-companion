<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Installation lookup and fallback chain</title>
  <desc id="description">An installation-bound lookup uses the installation console when a command exists or boots the runtime container when none does. A full runtime answer is returned as installation data. Failsafe or unreachable states fall back to package files and state their limitations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#101828" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a2b3"/></marker>
    <style>
      .eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.label{font:700 18px system-ui,sans-serif;fill:#101828}.copy{font:400 14px system-ui,sans-serif;fill:#475467}.code{font:600 13px ui-monospace,monospace;fill:#344054}.whiteLabel{font:700 18px system-ui,sans-serif;fill:#fff}.whiteCopy{font:400 14px system-ui,sans-serif;fill:#fff4e7}.line{fill:none;stroke:#98a2b3;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="660" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">INSTALLATION-BOUND ANSWERS</text>
  <text x="60" y="106" class="title">Ask the runtime, disclose the fallback</text>
  <text x="60" y="138" class="subtitle">Every path runs outside the MCP process and says which source actually answered.</text>

  <rect x="60" y="212" width="238" height="104" rx="20" fill="#101828" filter="url(#shadow)"/>
  <text x="86" y="251" class="whiteLabel">Installation lookup</text>
  <text x="86" y="279" class="whiteCopy">labels · icons · modules</text>
  <text x="86" y="301" class="whiteCopy">configuration · namespaces</text>
  <path d="M298 264 H365" class="line"/>

  <polygon points="460,194 555,264 460,334 365,264" fill="#fff4e7" stroke="#ffb55c"/>
  <text x="460" y="252" text-anchor="middle" class="label">Console</text>
  <text x="460" y="275" text-anchor="middle" class="copy">command exists?</text>

  <path d="M555 264 H640" class="line"/>
  <text x="585" y="249" class="code">yes</text>
  <rect x="640" y="212" width="220" height="104" rx="20" fill="#ffffff" stroke="#a4bcfd" filter="url(#shadow)"/>
  <text x="666" y="251" class="label">TYPO3 console</text>
  <text x="666" y="278" class="code">Typo3Cli::run()</text>
  <text x="666" y="300" class="copy">through DDEV when declared</text>

  <path d="M460 334 V392 H640" class="line"/>
  <text x="478" y="373" class="code">no</text>
  <rect x="640" y="358" width="220" height="104" rx="20" fill="#ffffff" stroke="#a4bcfd" filter="url(#shadow)"/>
  <text x="666" y="397" class="label">Runtime container</text>
  <text x="666" y="424" class="code">Typo3Runtime::ask()</text>
  <text x="666" y="446" class="copy">boots in its own subprocess</text>

  <path d="M860 264 H918" class="line"/>
  <path d="M860 410 H888 V336 H1029 V316" class="line"/>
  <rect x="918" y="212" width="222" height="104" rx="20" fill="#ecfdf3" stroke="#75e0a7"/>
  <text x="944" y="247" class="code">full</text>
  <text x="944" y="274" class="label">Runtime answer</text>
  <text x="944" y="298" class="copy">answeredBy: installation</text>

  <path d="M860 410 H888 V530 H918" class="line"/>
  <text x="894" y="468" class="code">failsafe / unreachable</text>
  <rect x="918" y="472" width="222" height="116" rx="20" fill="#fff4e7" stroke="#ffb55c"/>
  <text x="944" y="506" class="label">Package files</text>
  <text x="944" y="532" class="copy">answeredBy: packages</text>
  <text x="944" y="554" class="copy">Exact for declarations;</text>
  <text x="944" y="576" class="copy">dynamic registrations omitted.</text>

  <rect x="60" y="496" width="700" height="92" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="86" y="530" class="label">The fallback is part of the answer</text>
  <text x="86" y="557" class="copy">Source, reason and unread dynamic files travel with the result.</text>
  <text x="86" y="579" class="copy">A partial registry never looks complete.</text>
</svg>
