<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Parallel todo workflow</title>
  <desc id="description">Main holds shared claim state while each branch and worktree holds one session's unfinished work. Each finished branch is rebased, checked, fast-forwarded, and removed before the next branch repeats the sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8A8378"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#FBFAF7"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">ONE TODO · ONE BRANCH · ONE SESSION</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Main carries state; branches carry work</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Claims are shared immediately. Half-finished changes remain isolated until verified.</text>
  <rect x="60" y="190" width="1080" height="94" rx="6" fill="#1C1A17"/>
  <text x="86" y="226" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFFFFF">main</text>
  <text x="86" y="253" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#FFF6EC">todo/open → todo:claim → todo/progress records who owns each item</text>
  <rect x="760" y="211" width="348" height="52" rx="6" fill="#4A453D"/>
  <text x="782" y="242" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#FFFFFF">bin/cli todo:claim &lt;n&gt;</text>
  <path d="M260 284 V330" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 284 V330" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M940 284 V330" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="60" y="330" width="300" height="164" rx="6" fill="#FFFFFF" stroke="#F0C089"/>
    <text x="84" y="364" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">todo/alpha</text>
    <text x="84" y="397" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Branch + worktree</text>
    <text x="84" y="424" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">own composer install</text>
    <text x="84" y="447" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">one session, one claim</text>
    <text x="84" y="475" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">unfinished diff stays here</text>
  </g>
  <g>
    <rect x="450" y="330" width="300" height="164" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
    <text x="474" y="364" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">todo/bravo</text>
    <text x="474" y="397" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Branch + worktree</text>
    <text x="474" y="424" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">reads the same claimed main</text>
    <text x="474" y="447" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">touches its own todo</text>
    <text x="474" y="475" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">knows nothing of siblings</text>
  </g>
  <g>
    <rect x="840" y="330" width="300" height="164" rx="6" fill="#FFFFFF" stroke="#C9C3B7"/>
    <text x="864" y="364" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">todo/charlie</text>
    <text x="864" y="397" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Branch + worktree</text>
    <text x="864" y="424" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">a question becomes Waiting on</text>
    <text x="864" y="447" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">the branch keeps completed work</text>
    <text x="864" y="475" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">release moves the claim</text>
  </g>
  <path d="M210 494 V534 H990 M600 494 V546 M990 494 V534" fill="none" stroke="#8A8378" stroke-width="1.5"/>
  <path d="M600 534 V558" fill="none" stroke="#8A8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="558" width="700" height="92" rx="6" fill="#FFF6EC" stroke="#F0C089"/>
  <text x="278" y="591" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A17">Bring home one branch at a time</text>
  <text x="278" y="620" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#4A453D">rebase main → composer ci → merge --ff-only → remove worktree</text>
  <text x="278" y="641" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#4A453D">Then repeat from the top for the next completed branch.</text>
</svg>
