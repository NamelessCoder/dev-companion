<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Parallel todo workflow</title>
  <desc id="description">Main holds shared claim state while each branch and worktree holds one session's unfinished work. Each finished branch is rebased, checked, fast-forwarded, and removed before the next branch repeats the sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a2b3"/></marker>
    <style>.eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.label{font:700 18px system-ui,sans-serif;fill:#101828}.copy{font:400 14px system-ui,sans-serif;fill:#475467}.code{font:600 13px ui-monospace,monospace;fill:#344054}.whiteCode{font:600 13px ui-monospace,monospace;fill:#fff}.whiteLabel{font:700 18px system-ui,sans-serif;fill:#fff}.whiteCopy{font:400 14px system-ui,sans-serif;fill:#fff4e7}.line{fill:none;stroke:#98a2b3;stroke-width:2.5;marker-end:url(#arrow)}.bus{fill:none;stroke:#98a2b3;stroke-width:2.5}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">ONE TODO · ONE BRANCH · ONE SESSION</text>
  <text x="60" y="106" class="title">Main carries state; branches carry work</text>
  <text x="60" y="138" class="subtitle">Claims are shared immediately. Half-finished changes remain isolated until verified.</text>

  <rect x="60" y="190" width="1080" height="94" rx="20" fill="#101828"/>
  <text x="86" y="226" class="whiteLabel">main</text>
  <text x="86" y="253" class="whiteCopy">todo/open → todo:claim → todo/progress records who owns each item</text>
  <rect x="760" y="211" width="348" height="52" rx="14" fill="#344054"/>
  <text x="782" y="242" class="whiteCode">bin/cli todo:claim &lt;n&gt;</text>

  <path d="M260 284 V330" class="line"/>
  <path d="M600 284 V330" class="line"/>
  <path d="M940 284 V330" class="line"/>

  <g>
    <rect x="60" y="330" width="300" height="164" rx="20" fill="#ffffff" stroke="#ffb55c"/>
    <text x="84" y="364" class="code">todo/alpha</text>
    <text x="84" y="397" class="label">Branch + worktree</text>
    <text x="84" y="424" class="copy">own composer install</text>
    <text x="84" y="447" class="copy">one session, one claim</text>
    <text x="84" y="475" class="copy">unfinished diff stays here</text>
  </g>
  <g>
    <rect x="450" y="330" width="300" height="164" rx="20" fill="#ffffff" stroke="#a4bcfd"/>
    <text x="474" y="364" class="code">todo/bravo</text>
    <text x="474" y="397" class="label">Branch + worktree</text>
    <text x="474" y="424" class="copy">reads the same claimed main</text>
    <text x="474" y="447" class="copy">touches its own todo</text>
    <text x="474" y="475" class="copy">knows nothing of siblings</text>
  </g>
  <g>
    <rect x="840" y="330" width="300" height="164" rx="20" fill="#ffffff" stroke="#75e0a7"/>
    <text x="864" y="364" class="code">todo/charlie</text>
    <text x="864" y="397" class="label">Branch + worktree</text>
    <text x="864" y="424" class="copy">a question becomes Waiting on</text>
    <text x="864" y="447" class="copy">the branch keeps completed work</text>
    <text x="864" y="475" class="copy">release moves the claim</text>
  </g>

  <path d="M210 494 V534 H990 M600 494 V546 M990 494 V534" class="bus"/>
  <path d="M600 534 V558" class="line"/>
  <rect x="250" y="558" width="700" height="92" rx="20" fill="#fff4e7" stroke="#ffb55c"/>
  <text x="278" y="591" class="label">Bring home one branch at a time</text>
  <text x="278" y="620" class="code">rebase main → composer ci → merge --ff-only → remove worktree</text>
  <text x="278" y="641" class="copy">Then repeat from the top for the next completed branch.</text>
</svg>
