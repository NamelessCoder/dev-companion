<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">TYPO3 Dev Companion repository architecture (dark)</title>
  <desc id="description">The repository has a runtime lane starting at the stdio entrypoint and an upkeep lane starting at bin cli. Runtime tools compose results from knowledge, installation, manuals and core services. Upkeep commands maintain the repository's knowledge, evidence and work records.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6E6860"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#131210"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">TWO ENTRYPOINTS · ONE REPOSITORY</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Runtime answers; upkeep maintains</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">The server surface and the repository workflow share paths and bootstrap, not responsibilities.</text>
  <rect x="60" y="182" width="1080" height="44" rx="6" fill="#1C1A16"/>
  <text x="84" y="210" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.4" fill="#FFA338">RUNTIME — WHAT CLIENTS ASK</text>
  <rect x="60" y="244" width="225" height="82" rx="6" fill="#EDE9E2"/>
  <text x="84" y="277" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#171614">stdio entrypoint</text>
  <text x="84" y="303" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#171614">bin/typo3-dev-companion</text>
  <path d="M285 285 H330" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="244" width="225" height="82" rx="6" fill="#171614" stroke="#4A4437"/>
  <text x="354" y="277" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Server/</text>
  <text x="354" y="303" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">entrypoint · factory · profile</text>
  <path d="M555 285 H600" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="244" width="225" height="82" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="624" y="277" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Tool/ + Sdk/</text>
  <text x="624" y="303" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">registry · schemas · dispatch</text>
  <path d="M825 285 H870" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="870" y="244" width="270" height="82" rx="6" fill="#0C0B0A" stroke="#37332C"/>
  <text x="894" y="277" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Result/</text>
  <text x="894" y="303" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">readable text + structured content</text>
  <path d="M712 326 V350 H260 V372" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M712 350 H480 V372" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M712 350 H700 V372" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M712 350 H920 V372" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="160" y="372" width="200" height="76" rx="6" fill="#171614" stroke="#4A4437"/>
  <text x="184" y="403" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Knowledge/</text><text x="184" y="427" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">bundled corpus</text>
  <rect x="380" y="372" width="200" height="76" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="404" y="403" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Installation/</text><text x="404" y="427" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">project and runtime</text>
  <rect x="600" y="372" width="200" height="76" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="624" y="403" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Manual/</text><text x="624" y="427" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">official manuals</text>
  <rect x="820" y="372" width="200" height="76" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="844" y="403" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Contribution/</text><text x="844" y="427" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">Forge and Gerrit</text>
  <rect x="60" y="486" width="1080" height="44" rx="6" fill="#0C0B0A"/>
  <text x="84" y="514" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.4" fill="#A9A299">UPKEEP — WHAT MAINTAINS THIS CHECKOUT</text>
  <rect x="60" y="548" width="225" height="82" rx="6" fill="#EDE9E2"/>
  <text x="84" y="581" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#171614">repository CLI</text>
  <text x="84" y="607" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#171614">bin/cli</text>
  <path d="M285 589 H330" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="548" width="225" height="82" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="354" y="581" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Upkeep/Cli</text>
  <text x="354" y="607" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">registers every command</text>
  <path d="M555 589 H600" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="548" width="225" height="82" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="624" y="581" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Upkeep/Command/</text>
  <text x="624" y="607" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">one subject:verb each</text>
  <path d="M825 589 H870" fill="none" stroke="#6E6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="870" y="548" width="270" height="82" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="894" y="581" font-weight="700" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Repository records</text>
  <text x="894" y="607" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">knowledge · evidence · todo · decisions</text>
  <text x="60" y="677" font-weight="400" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">Shared foundation: src/bootstrap.php locates the autoloader; src/Paths.php resolves this checkout.</text>
</svg>
