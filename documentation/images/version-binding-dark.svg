<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Version-bound knowledge (dark)</title>
  <desc id="description">TYPO3 Dev Companion covers TYPO3 12 through 15. A statement without bounds applies to all covered versions. Since and until bind individual statements to a range, and each boundary is verified on the covered version before and after it.</desc>
  <defs>
  </defs>
  <rect width="1200" height="620" fill="#131210"/>
  <text x="60" y="62" font-weight="700" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" letter-spacing="1.8" fill="#FF8700">THE STATEMENT CARRIES THE RANGE</text>
  <text x="60" y="106" font-weight="700" font-size="34" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">Version differences are data</text>
  <text x="60" y="138" font-weight="400" font-size="17" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">Bind only what changed; keep the surrounding knowledge shared.</text>
  <line x1="168" y1="238" x2="1032" y2="238" stroke="#37332C" stroke-width="8" stroke-linecap="round"/>
  <g>
    <circle cx="210" cy="238" r="28" fill="#221F1B"/><text x="210" y="246" text-anchor="middle" font-weight="700" font-size="22" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">12</text><text x="210" y="283" text-anchor="middle" font-weight="600" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#6E6860">12.4 · LTS</text>
    <circle cx="470" cy="238" r="28" fill="#221F1B"/><text x="470" y="246" text-anchor="middle" font-weight="700" font-size="22" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">13</text><text x="470" y="283" text-anchor="middle" font-weight="600" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#6E6860">13.4 · LTS</text>
    <circle cx="730" cy="238" r="28" fill="#221F1B"/><text x="730" y="246" text-anchor="middle" font-weight="700" font-size="22" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">14</text><text x="730" y="283" text-anchor="middle" font-weight="600" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#6E6860">14.3 · stable</text>
    <circle cx="990" cy="238" r="28" fill="#221F1B"/><text x="990" y="246" text-anchor="middle" font-weight="700" font-size="22" font-family="'Source Sans 3',system-ui,sans-serif" fill="#EDE9E2">15</text><text x="990" y="283" text-anchor="middle" font-weight="600" font-size="13" font-family="'Source Sans 3',system-ui,sans-serif" fill="#6E6860">main · development</text>
  </g>
  <rect x="60" y="332" width="340" height="114" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="86" y="366" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#A9A299">no since / until</text>
  <line x1="86" y1="392" x2="374" y2="392" stroke="#37332C" stroke-width="10" stroke-linecap="round"/>
  <text x="86" y="425" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">Holds on every covered line.</text>
  <rect x="430" y="332" width="340" height="114" rx="6" fill="#1C1A16" stroke="#4A4437"/>
  <text x="456" y="366" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#A9A299">since: 14</text>
  <line x1="610" y1="392" x2="744" y2="392" stroke="#FF8700" stroke-width="10" stroke-linecap="round"/>
  <text x="456" y="425" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">Absent on 13; present on 14.</text>
  <rect x="800" y="332" width="340" height="114" rx="6" fill="#171614" stroke="#37332C"/>
  <text x="826" y="366" font-weight="600" font-size="13" font-family="'Source Code Pro',ui-monospace,monospace" fill="#A9A299">until: 13</text>
  <line x1="826" y1="392" x2="960" y2="392" stroke="#37332C" stroke-width="10" stroke-linecap="round"/>
  <text x="826" y="425" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#A9A299">Present on 13; absent on 14.</text>
  <rect x="220" y="500" width="760" height="72" rx="6" fill="#EDE9E2"/>
  <text x="250" y="532" font-weight="700" font-size="18" font-family="'Source Sans 3',system-ui,sans-serif" fill="#171614">A boundary is verified on both sides</text>
  <text x="250" y="556" font-weight="400" font-size="14" font-family="'Source Sans 3',system-ui,sans-serif" fill="#1C1A16">The answer filters by targetVersion and renders the applicable range beside the statement.</text>
</svg>
