<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Version-bound knowledge</title>
  <desc id="description">TYPO3 Dev Companion covers TYPO3 12 through 15. A statement without bounds applies to all covered versions. Since and until bind individual statements to a range, and each boundary is verified on the covered version before and after it.</desc>
  <defs>
    <style>.eyebrow{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#ff8700}.title{font:700 34px system-ui,sans-serif;fill:#101828}.subtitle{font:400 17px system-ui,sans-serif;fill:#475467}.major{font:700 22px system-ui,sans-serif;fill:#101828}.label{font:700 18px system-ui,sans-serif;fill:#101828}.copy{font:400 14px system-ui,sans-serif;fill:#475467}.code{font:600 13px ui-monospace,monospace;fill:#344054}.small{font:600 12px system-ui,sans-serif;fill:#667085}.whiteLabel{font:700 18px system-ui,sans-serif;fill:#fff}.whiteCopy{font:400 14px system-ui,sans-serif;fill:#fff4e7}</style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" class="eyebrow">THE STATEMENT CARRIES THE RANGE</text>
  <text x="60" y="106" class="title">Version differences are data</text>
  <text x="60" y="138" class="subtitle">Bind only what changed; keep the surrounding knowledge shared.</text>

  <line x1="168" y1="238" x2="1032" y2="238" stroke="#d0d5dd" stroke-width="8" stroke-linecap="round"/>
  <g>
    <circle cx="210" cy="238" r="28" fill="#ff8700"/><text x="210" y="246" text-anchor="middle" class="major">12</text><text x="210" y="283" text-anchor="middle" class="small">12.4 · LTS</text>
    <circle cx="470" cy="238" r="28" fill="#ff9f2f"/><text x="470" y="246" text-anchor="middle" class="major">13</text><text x="470" y="283" text-anchor="middle" class="small">13.4 · LTS</text>
    <circle cx="730" cy="238" r="28" fill="#ffb55c"/><text x="730" y="246" text-anchor="middle" class="major">14</text><text x="730" y="283" text-anchor="middle" class="small">14.3 · stable</text>
    <circle cx="990" cy="238" r="28" fill="#ffd39b"/><text x="990" y="246" text-anchor="middle" class="major">15</text><text x="990" y="283" text-anchor="middle" class="small">main · development</text>
  </g>

  <rect x="60" y="332" width="340" height="114" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="86" y="366" class="code">no since / until</text>
  <line x1="86" y1="392" x2="374" y2="392" stroke="#6172f3" stroke-width="10" stroke-linecap="round"/>
  <text x="86" y="425" class="copy">Holds on every covered line.</text>

  <rect x="430" y="332" width="340" height="114" rx="18" fill="#fff4e7" stroke="#ffb55c"/>
  <text x="456" y="366" class="code">since: 14</text>
  <line x1="610" y1="392" x2="744" y2="392" stroke="#ff8700" stroke-width="10" stroke-linecap="round"/>
  <text x="456" y="425" class="copy">Absent on 13; present on 14.</text>

  <rect x="800" y="332" width="340" height="114" rx="18" fill="#ffffff" stroke="#75e0a7"/>
  <text x="826" y="366" class="code">until: 13</text>
  <line x1="826" y1="392" x2="960" y2="392" stroke="#12b76a" stroke-width="10" stroke-linecap="round"/>
  <text x="826" y="425" class="copy">Present on 13; absent on 14.</text>

  <rect x="220" y="500" width="760" height="72" rx="18" fill="#101828"/>
  <text x="250" y="532" class="whiteLabel">A boundary is verified on both sides</text>
  <text x="250" y="556" class="whiteCopy">The answer filters by targetVersion and renders the applicable range beside the statement.</text>
</svg>
